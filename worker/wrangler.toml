# Cloudflare Worker for The Copper & Blue News Game alerts. See README.md for the exact deploy steps.
name = "cbn-alerts"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
GAME_ALERTS_ENABLED = "1"
# Exact next-game start: excludes every game present in the old Actions sent-state cache.
GAME_ALERTS_SINCE = "2026-11-08T03:00:00Z"
# Public half of the VAPID keypair; must match VAPID_PUBLIC_KEY in ../js/config.js.
VAPID_PUBLIC_KEY = "BKZoaKWaPmx65jY1P9Jpm5O5CbBnsMq4l1DPUob_pHIxkaJGqBP3uywE0H-RUvl3yWqoSt_F5PNYkyJ7g9OMFmY"
# Contact for push services (a mailto: address or the site URL).
VAPID_SUBJECT = "https://copperandbluenews.com"   # or "mailto:you@example.com"
# Secrets (NOT here): wrangler secret put VAPID_PRIVATE_KEY / NOTIFY_SECRET / ADMIN_SECRET

[[kv_namespaces]]
binding = "ALERTS_KV"
id = "bd357294d6cb41389f990ce6ad9cd242"   # printed by: npx wrangler kv namespace create cbn-alerts

# Fan-out queue (Queues is on the Workers Free plan). Remove both blocks to send inline instead
# (inline is capped at 45 pushes per alert on the Free plan).
[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "cbn-push"

[[queues.consumers]]
queue = "cbn-push"
max_batch_size = 1
max_retries = 10

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "GAME_ALERTS"
class_name = "GameAlerts"

[exports.GameAlerts]
type = "durable-object"
storage = "sqlite"
