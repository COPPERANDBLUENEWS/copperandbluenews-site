# Refreshes data (schedule, box scores, stats) every 3 hours, commits it if it
# changed (finished box scores are cached in the repo), and deploys the site to Pages.
name: Update data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/update_data.py
      - run: python3 scripts/update_news.py || true
      - run: python3 scripts/update_lineup.py || true
      - run: python3 scripts/update_fantasy.py || true
      - name: Commit data if changed
        run: |
          git add data.json data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game data"
          git pull --rebase -X theirs origin main || true
          git push
      - name: Assemble site
        run: rsync -a --exclude .git --exclude .github --exclude scripts --exclude screenshots --exclude README.md ./ _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
