# Live game updates. A cron run every 10 minutes checks whether an Oilers game is
# live (or starts within 30 min). If so it refreshes the data, deploys the site
# to Pages (no commits), waits briefly and re-dispatches itself, so updates keep
# flowing about every 2 minutes until the game is final. Each cycle also refreshes
# data/pbp/<id>.json (play-by-play) for the Live rink tracker (tracker.html). Off game days each run
# exits in ~20 seconds. Public repos get free Actions minutes; every run is short,
# far under the 6-hour job limit.
name: Live game updates
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Test: deploy once even if no game is live (no re-dispatch)"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live: ${{ steps.data.outputs.live }}
    env:
      ALERTS_ON: ${{ secrets.WORKER_URL != '' && secrets.NOTIFY_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: data
        run: python3 scripts/update_data.py
        env:
          LIVE_RUN: "1"
          FORCE_LIVE: ${{ inputs.force && '1' || '0' }}
      # Game alerts (web push via worker/, see worker/README.md). Off until the WORKER_URL and
      # NOTIFY_SECRET repo secrets exist. Sent event ids carry over between runs in the Actions cache.
      - name: Restore sent-alerts state
        if: env.ALERTS_ON == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cbn-alerts
          key: cbn-alerts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cbn-alerts-
      # puck drop, goals, period ends, final (runs even when live=0 so the final is caught)
      - name: Game alerts (game)
        id: game_alerts
        if: env.ALERTS_ON == 'true'
        run: python3 scripts/notify_alerts.py --pregame --game || true  # pre-game odds ~1 h out, then game events
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      # Flip the lineup to "Confirmed (official)" as soon as the NHL game sheet has it (deployed, not committed).
      - if: steps.data.outputs.live == '1'
        run: python3 scripts/update_lineup.py || true
      - name: Game alerts (lineup)
        id: lineup_alerts
        if: env.ALERTS_ON == 'true' && steps.data.outputs.live == '1'
        run: python3 scripts/notify_alerts.py --lineup || true
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      - name: Save sent-alerts state
        if: always() && env.ALERTS_ON == 'true' && (steps.game_alerts.outputs.changed == '1' || steps.lineup_alerts.outputs.changed == '1')
        uses: actions/cache/save@v4
        with:
          path: ~/.cbn-alerts
          key: cbn-alerts-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.data.outputs.live == '1'
        run: python3 scripts/update_fantasy.py --outlook || true  # picks up the final box score
      - if: steps.data.outputs.live == '1'
        run: rsync -a --exclude .git --exclude .github --exclude scripts --exclude screenshots --exclude README.md --exclude worker ./ _site/
      - if: steps.data.outputs.live == '1'
        uses: actions/upload-pages-artifact@v3
  deploy:
    needs: check
    if: needs.check.outputs.live == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: site
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
      - name: Keep going while the game is on
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run live.yml --repo "$GITHUB_REPOSITORY" --ref main
