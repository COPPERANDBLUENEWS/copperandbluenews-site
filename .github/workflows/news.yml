# Hourly: Oilers news (data/news.json) + injury report (data/injuries.json) from public feeds,
# plus the game-day lineup (data/lineup.json, scripts/update_lineup.py; see also lineup.yml).
# The 15:05 UTC run (~8 AM PT) is the "daily" injury refresh; every hourly run refreshes it too.
name: News and injuries
on:
  schedule:
    - cron: "41 * * * *"
    - cron: "5 15 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/update_news.py
      - run: python3 scripts/update_lineup.py || true
      - name: Commit if changed
        run: |
          git add data/news.json data/injuries.json data/lineup.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news, injuries and lineup"
          git pull --rebase -X theirs origin main || true
          git push
      - name: Refresh live game data before deploying
        # Without this, a deploy during a game would put the committed (older) live score,
        # box score and play-by-play back on the site until the live loop redeploys.
        run: python3 scripts/update_data.py || true
        env:
          LIVE_RUN: "1"
      - name: Assemble site
        run: rsync -a --exclude .git --exclude .github --exclude scripts --exclude screenshots --exclude README.md ./ _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
