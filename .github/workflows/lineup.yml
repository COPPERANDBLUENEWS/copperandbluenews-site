# Game-day lineup refresh. news.yml already refreshes data/lineup.json hourly at :41;
# this adds runs at :11 from 3 PM to 8 PM PT (22:00-03:00 UTC; BC is on UTC-7 year-round),
# so on game days the lineup updates every ~30 min around morning skate -> puck drop -> final.
# Off game days the script exits right away (GAMEDAY_ONLY=1) and nothing is deployed.
# The 16:00 UTC run (9 AM PT) also sends the "Game day morning" alert, and the :11 runs catch the
# pre-game odds alert (~1 h before puck drop) if the 10-minute live loop is late.
name: Game-day lineup
on:
  schedule:
    - cron: "11 22,23,0,1,2,3 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.lineup.outputs.changed }}
    env:
      ALERTS_ON: ${{ secrets.WORKER_URL != '' && secrets.NOTIFY_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: lineup
        run: python3 scripts/update_lineup.py
        env:
          GAMEDAY_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
      # Game alerts (web push via worker/, see worker/README.md). Off until the WORKER_URL and
      # NOTIFY_SECRET repo secrets exist. Sent event ids carry over between runs in the Actions cache.
      - name: Restore sent-alerts state
        if: env.ALERTS_ON == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cbn-alerts
          key: cbn-alerts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cbn-alerts-
      # game day morning (9 AM PT) / pre-game odds (~1 h out) / starting goalie + official lineup confirmed
      - name: Game alerts (morning, odds, lineup)
        id: lineup_alerts
        if: env.ALERTS_ON == 'true'
        run: python3 scripts/notify_alerts.py --morning --pregame --lineup || true
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      - name: Save sent-alerts state
        if: always() && env.ALERTS_ON == 'true' && (steps.lineup_alerts.outputs.changed == '1')
        uses: actions/cache/save@v4
        with:
          path: ~/.cbn-alerts
          key: cbn-alerts-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.lineup.outputs.changed == '1'
        run: python3 scripts/update_fantasy.py --outlook || true  # starter/PP units feed the Fantasy Outlook
      - name: Commit if changed
        if: steps.lineup.outputs.changed == '1'
        run: |
          git add data/lineup.json data/fantasy.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game-day lineup"
          git pull --rebase -X theirs origin main || true
          git push
      - name: Refresh live game data before deploying
        if: steps.lineup.outputs.changed == '1'
        # Without this, a deploy during a game would put the committed (older) live score,
        # box score and play-by-play back on the site until the live loop redeploys.
        run: python3 scripts/update_data.py && python3 scripts/update_fantasy.py --outlook || true
        env:
          LIVE_RUN: "1"
      - if: steps.lineup.outputs.changed == '1'
        run: rsync -a --exclude .git --exclude .github --exclude scripts --exclude screenshots --exclude README.md --exclude worker ./ _site/
      - if: steps.lineup.outputs.changed == '1'
        uses: actions/upload-pages-artifact@v3
  deploy:
    needs: check
    if: needs.check.outputs.changed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
