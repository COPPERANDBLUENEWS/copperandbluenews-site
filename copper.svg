<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Copper, The Copper &amp; Blue News mascot</title><desc id="desc">An original determined copper oil drop with a bare pointed oil-drop top, chunky navy hockey gloves with copper cuffs, a purple black eye and a gap-toothed grin, holding a hockey stick. No team logos or numbers.</desc>
